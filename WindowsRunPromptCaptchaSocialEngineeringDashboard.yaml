  de4d1056-6849-4ba1-94a4-8a133a289a18:
    x: 0
    y: 20
    height: 4
    queryString: |-
      // Cyrillic characters with “CAPTCHA”-related words
      #event_simpleName=ProcessRollup2
      | event_platform=Win ParentBaseFileName=/explorer\.exe/i FileName=/powershell\.exe/i
      // find CommandLine containing characters outside standard 0-127 ASCII - 0x00C0-0x052F (latin A - Cyrillic El)
      | CommandLine=/[À-ԯ]/
      // optional: look for network protocol reference
      | CommandLine=/\:\/\//
      // find words similar to "robot", "human", "CAPTCHA", or "verification"
      | CommandLine=/([rгр][oοо][bб][oοо][tт]|[hн][uμ][mм][aаА][nп]|[cсС][aаА][pрР]([tтТ])?[cсС][hнН][aаА]|[vν][eе][rг][iі][fF][iі][cсС][aа][tт][iі][oо][nп])/iF
      | non_ascii_CommandLine := replace("[\x00-\x7F]", with=" ", field=CommandLine)
      | format("%s\n%s", field=[CommandLine, non_ascii_CommandLine], as=CommandLine)
      | table([@timestamp, #event_simpleName, cid, aid, ComputerName, UserName, CommandLine, ParentBaseFileName, RegStringValue])
    end: now
    start: 1y
    width: 12
    options:
      columns:
      - fieldName: '@timestamp'
        format: datetime
        type: field
        width: 200
      - groupByPrefix: false
        header: Field List
        type: fieldList
      newestAtBottom: true
      showOnlyFirstLine: false
